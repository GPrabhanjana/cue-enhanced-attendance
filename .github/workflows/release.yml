# Submits a new version to addons.mozilla.org (public listing) whenever the
# version in extension/manifest.json is bumped on main.
#
#   1. lint the add-on
#   2. submit it to AMO on the "listed" channel (amo-metadata.json supplies
#      the listing details the first time)
#   3. create a GitHub Release vX.Y.Z as a changelog entry
#
# AMO then signs it and delivers the update to every installed copy.
# Needs repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET
# (addons.mozilla.org -> Developer Hub -> Manage API Keys).

name: Release

on:
  push:
    branches: [main]
    paths: ["extension/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: v
        run: |
          VERSION=$(jq -r .version extension/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already released. Bump \"version\" in extension/manifest.json to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.v.outputs.exists == 'false'
        with:
          node-version: 22

      - name: Lint
        if: steps.v.outputs.exists == 'false'
        run: npx --yes web-ext@8 lint --source-dir extension --warnings-as-errors

      - name: Submit to addons.mozilla.org (listed)
        if: steps.v.outputs.exists == 'false'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Missing AMO_JWT_ISSUER / AMO_JWT_SECRET repository secrets."
            exit 1
          fi
          # approval-timeout 0: submit and don't wait for Mozilla's review.
          npx --yes web-ext@8 sign \
            --source-dir extension \
            --artifacts-dir dist \
            --channel listed \
            --amo-metadata amo-metadata.json \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --approval-timeout 0

      - name: Create GitHub release (changelog)
        if: steps.v.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            --notes "Submitted to [addons.mozilla.org](https://addons.mozilla.org/firefox/addon/cue-enhanced-attendance/). Firefox installs it automatically once Mozilla has processed it."
